name: NuGet Manual Publish

on: [workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  publish_job:
    runs-on: ubuntu-latest
    # publish only what is on master
    if: github.ref == 'refs/heads/master'

    # NuGet trusted publishing: no stored API key. The job gets a GitHub OIDC
    # token, which nuget.org exchanges for an API key valid for one hour,
    # provided it matches the trusted publishing policy for this repo and
    # workflow file (nuget.org > your profile > Trusted Publishing).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Pack
        run: dotnet pack src/MysticMind.PostgresEmbed/MysticMind.PostgresEmbed.csproj -c Release -o artifacts

      # requested right before the push: the key expires after one hour
      - name: NuGet login (OIDC to short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mysticmind # nuget.org profile name of the package owner, not an email address

      # the matching .snupkg symbol package is pushed along with each .nupkg
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
